name: Bug report
description: Something is wrong in the game or the launcher.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did and what happened, and where in the game.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Release or commit
      placeholder: e.g. AppImage 0.1.1-linux.1, or commit a1b2c3d
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Device, GPU and driver
      placeholder: e.g. Steam Deck LCD, or RTX 4070 with NVIDIA 580 / RX 7800 XT with Mesa 26
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Distribution or SteamOS version, and Proton or Wine version
      placeholder: e.g. SteamOS 3.8, Proton Experimental
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: pkp.log
      description: Drag in pkp.log from the session where it happened.
